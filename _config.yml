# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site language
lang: ko-KR

# Site title
title: "Insights & Innovations"

# A description of your site for meta tag, search engine results.
description: ""

# The subpath of your site, e.g. /blog, for generating urls.
baseurl: "/"

# The base hostname & protocol of your site for where absolute urls are needed.
url: "https://reddol18.pe.kr"

# Favicon
favicon: images/favicon.png

# Kakao AdFit units (header, footer loader, adfit/adfit2 includes). false hides them all.
adfit_enabled: false

# Banners beside each post (below the post on narrow screens). Clicks are sent to GA as "banner_click".
side_banners:
  - id: contact_form
    image: /assets/images/banners/contact.jpg
    url: https://docs.google.com/forms/d/e/1FAIpQLSepG3NEXsjGKJx7XJ3b6AAkW0vJr0OrAW-o_x4rEDUckg7XBA/viewform
    alt: "프로젝트·협업 문의 — 구글폼 바로가기"
  - id: youtube
    image: /assets/images/banners/youtube.jpg
    url: https://www.youtube.com/@aidothat
    alt: "유튜브 채널 @aidothat 구독하기"

# Google Analytics id, e.g. "UA-NNNNNNNN-N"
google_analytics: "G-4YGBJY6T0F"

# Site navigation - each item must have a title and a url.
navigation:
  - text: Home
    url: /
  - text: About
    url: /about
  - text: Tags
    url: /tags

# The shortname for your Disqus site to enable comments.
disqus: dev5min
layout: default
comments: true

# Colors
accent_color: '#078205'

# Site footer
footer:
  content: "&copy; Scriptor all rights reserved. Theme by [JustGoodThemes](https://www.justgoodthemes.com)."
  has_social: false

# Plugins
plugins:
  - jekyll-paginate

# http://jekyllrb.com/docs/pagination/
paginate: 16
paginate_path: '/page:num/'


# Permalinks
permalink: /:title

# Conversion
markdown: kramdown

# Sass
sass:
  sass_dir: _sass
  style: compressed
