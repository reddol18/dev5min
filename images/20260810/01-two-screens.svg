<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6FB"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFCFE"/>
    </linearGradient>
    <linearGradient id="blueChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="greenChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.14"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="660" rx="20" fill="url(#bg)"/>

  <text x="450" y="42" text-anchor="middle" font-size="17" font-weight="800" fill="#0F172A">
    두 창이 각자 돌다가, <tspan fill="#2563EB">필요할 때만</tspan> 말을 겁니다
  </text>
  <text x="450" y="66" text-anchor="middle" font-size="12.5" fill="#64748B">
    왼쪽은 제가 있는 창, 오른쪽은 다른 일을 하던 창 — 시간은 위에서 아래로 흐릅니다
  </text>

  <!-- column headers -->
  <rect x="60" y="88" width="330" height="30" rx="8" fill="url(#blueChip)"/>
  <text x="225" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">이쪽 창</text>
  <rect x="510" y="88" width="330" height="30" rx="8" fill="#475569"/>
  <text x="675" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">다른 창</text>

  <!-- time axis -->
  <line x1="450" y1="130" x2="450" y2="600" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- STEP 1 -->
  <circle cx="450" cy="165" r="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="450" y="170" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">1</text>
  <rect x="60" y="138" width="330" height="54" rx="10" fill="url(#win)" stroke="#E2E8F0" filter="url(#soft)"/>
  <text x="78" y="160" font-size="11.5" fill="#0F172A">사용자와 대화 중</text>
  <text x="78" y="180" font-size="10.5" fill="#94A3B8">"그 일 준비됐는지 물어봐 줘"</text>
  <rect x="510" y="138" width="330" height="54" rx="10" fill="url(#win)" stroke="#E2E8F0" filter="url(#soft)"/>
  <text x="528" y="160" font-size="11.5" fill="#0F172A">따로 자기 일 하는 중</text>
  <text x="528" y="180" font-size="10.5" fill="#94A3B8">이쪽 대화는 전혀 모릅니다</text>

  <!-- STEP 2 : send -->
  <circle cx="450" cy="255" r="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="450" y="260" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">2</text>
  <rect x="60" y="228" width="330" height="54" rx="10" fill="#EFF6FF" stroke="#BFDBFE" filter="url(#soft)"/>
  <text x="78" y="250" font-size="11.5" font-weight="700" fill="#1D4ED8">질문을 보냅니다</text>
  <text x="78" y="270" font-size="10.5" fill="#64748B">배경까지 같이 — 상대는 맥락이 없으니까요</text>
  <path d="M395 255 L505 255" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- STEP 3 : other side works by itself -->
  <circle cx="450" cy="360" r="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="450" y="365" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">3</text>
  <rect x="60" y="318" width="330" height="84" rx="10" fill="url(#win)" stroke="#E2E8F0" filter="url(#soft)"/>
  <text x="78" y="342" font-size="11.5" fill="#0F172A">기다리지 않고 하던 일 계속</text>
  <text x="78" y="362" font-size="10.5" fill="#94A3B8">멈춰 서서 답을 기다리지 않습니다</text>
  <text x="78" y="384" font-size="10.5" fill="#94A3B8">사용자와 다른 이야기를 해도 됩니다</text>

  <rect x="510" y="318" width="330" height="84" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#soft)"/>
  <text x="528" y="342" font-size="11.5" font-weight="700" fill="#334155">저쪽 화면이 스스로 움직입니다</text>
  <circle cx="536" cy="358" r="3" fill="#94A3B8"/>
  <text x="548" y="362" font-size="10.5" fill="#64748B">자기 파일과 설정을 확인하고</text>
  <circle cx="536" cy="378" r="3" fill="#94A3B8"/>
  <text x="548" y="382" font-size="10.5" fill="#64748B">돌고 있는 작업 상태를 살핍니다</text>

  <!-- STEP 4 : reply comes back on its own -->
  <circle cx="450" cy="470" r="15" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
  <text x="450" y="475" text-anchor="middle" font-size="11" font-weight="800" fill="#059669">4</text>
  <path d="M505 470 L395 470" stroke="#10B981" stroke-width="2.5" marker-end="url(#arG)"/>
  <rect x="510" y="443" width="330" height="54" rx="10" fill="#ECFDF5" stroke="#A7F3D0" filter="url(#soft)"/>
  <text x="528" y="465" font-size="11.5" font-weight="700" fill="#047857">정리해서 먼저 보냅니다</text>
  <text x="528" y="485" font-size="10.5" fill="#64748B">제가 다시 묻지 않았는데도요</text>
  <rect x="60" y="443" width="330" height="54" rx="10" fill="url(#win)" stroke="#E2E8F0" filter="url(#soft)"/>
  <text x="78" y="465" font-size="11.5" fill="#0F172A">대화 중에 답이 끼어듭니다</text>
  <text x="78" y="485" font-size="10.5" fill="#94A3B8">준비 완료 · 밀린 것 · 오늘 추가로 할 일</text>

  <!-- bottom takeaway -->
  <rect x="60" y="530" width="780" height="86" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#soft)"/>
  <rect x="60" y="530" width="6" height="86" rx="3" fill="url(#greenChip)"/>
  <text x="86" y="560" font-size="12.5" font-weight="800" fill="#0F172A">여기서 중요한 건 4번입니다</text>
  <text x="86" y="583" font-size="11.5" fill="#475569">일을 맡기고 기다리는 방식에서는, 상대가 끝날 때 딱 한 번 결과를 줍니다.</text>
  <text x="86" y="603" font-size="11.5" fill="#475569">옆자리에 앉은 방식에서는, 상대가 하던 일을 멈추지 않고도 <tspan font-weight="700" fill="#047857">먼저 말을 걸 수 있습니다.</tspan></text>
</svg>
