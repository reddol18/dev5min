<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6fa"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2744" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#98a2b8"/>
    </marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#c0475c"/>
    </marker>
    <marker id="arGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#12805f"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="url(#bg)"/>

  <text x="40" y="46" font-size="19" font-weight="700" fill="#1a2744">같은 관측, 갈라지는 두 경로</text>
  <text x="40" y="70" font-size="13.5" fill="#69748d">손에 있던 사실은 같았습니다. 무엇을 먼저 의심했는가만 달랐습니다.</text>

  <!-- 공통 관측 -->
  <rect x="40" y="96" width="196" height="112" rx="5" fill="#ffffff" stroke="#dde2ec" filter="url(#sh)"/>
  <text x="58" y="122" font-size="11" font-weight="700" fill="#8b95ab" letter-spacing="0.9">관측된 사실</text>
  <text x="58" y="147" font-size="12.5" fill="#33405c">생성은 성공 응답</text>
  <text x="58" y="168" font-size="12.5" fill="#33405c">조회는 “없음”</text>
  <text x="58" y="189" font-size="12.5" fill="#33405c">우리 코드는 그대로</text>

  <path d="M236 132 L280 132" stroke="#98a2b8" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M236 172 L280 172" stroke="#98a2b8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 위쪽: 의심 경로 -->
  <rect x="284" y="98" width="238" height="70" rx="5" fill="#fdf0f2" stroke="#f0c5cd"/>
  <text x="302" y="122" font-size="11" font-weight="700" fill="#c0475c" letter-spacing="0.9">의심</text>
  <text x="302" y="145" font-size="12.5" fill="#8a3444">“안 바뀐 코드는 옳다.</text>
  <text x="302" y="163" font-size="12.5" fill="#8a3444">그러니 바뀐 쪽은 상대다.”</text>

  <path d="M522 133 L566 133" stroke="#c0475c" stroke-width="1.6" marker-end="url(#arRed)"/>

  <rect x="570" y="98" width="266" height="70" rx="5" fill="#ffffff" stroke="#f0c5cd"/>
  <text x="588" y="122" font-size="11" font-weight="700" fill="#c0475c" letter-spacing="0.9">막다른 길</text>
  <text x="588" y="145" font-size="12.5" fill="#33405c">문의 메일 · 회신 대기</text>
  <text x="588" y="163" font-size="12.5" fill="#8a3444">그동안 원인은 그대로</text>

  <!-- 아래쪽: 신뢰 경로 -->
  <rect x="284" y="196" width="238" height="70" rx="5" fill="#eaf5f0" stroke="#b9ddcd"/>
  <text x="302" y="220" font-size="11" font-weight="700" fill="#12805f" letter-spacing="0.9">신뢰</text>
  <text x="302" y="243" font-size="12.5" fill="#14624c">“상대가 옳다면,</text>
  <text x="302" y="261" font-size="12.5" fill="#14624c">어긋난 곳은 우리 쪽이다.”</text>

  <path d="M522 231 L566 231" stroke="#12805f" stroke-width="1.6" marker-end="url(#arGreen)"/>

  <rect x="570" y="196" width="266" height="70" rx="5" fill="#ffffff" stroke="#b9ddcd"/>
  <text x="588" y="220" font-size="11" font-weight="700" fill="#12805f" letter-spacing="0.9">지금 할 수 있는 일</text>
  <text x="588" y="243" font-size="12.5" fill="#33405c">규격 전수 대조</text>
  <text x="588" y="261" font-size="12.5" fill="#14624c">30분 만에 원인 확인</text>

  <!-- 하단 결론 -->
  <line x1="40" y1="308" x2="840" y2="308" stroke="#e2e7f0" stroke-width="1"/>

  <text x="40" y="340" font-size="13" font-weight="700" fill="#1a2744">실제로 어긋나 있던 곳</text>

  <rect x="40" y="356" width="386" height="86" rx="5" fill="#ffffff" stroke="#dde2ec" filter="url(#sh)"/>
  <text x="58" y="380" font-size="11" font-weight="700" fill="#8b95ab" letter-spacing="0.9">명세가 받는 필드</text>
  <text x="58" y="406" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#12805f">orderId</text>
  <text x="58" y="428" font-size="12" fill="#69748d">required: [ orderId ] — 하나뿐</text>

  <rect x="454" y="356" width="386" height="86" rx="5" fill="#ffffff" stroke="#f0c5cd" filter="url(#sh)"/>
  <text x="472" y="380" font-size="11" font-weight="700" fill="#c0475c" letter-spacing="0.9">우리가 보내던 것</text>
  <text x="472" y="406" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#33405c">orderId<tspan fill="#c0475c">, amount, hash</tspan></text>
  <text x="472" y="428" font-size="12" fill="#8a3444">여분 두 개 — 이것이 조회를 막았습니다</text>
</svg>
